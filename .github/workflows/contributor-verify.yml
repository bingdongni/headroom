name: Contributor verification
on:
  push:
    branches: ['verify/query-reminders']
permissions:
  contents: read
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      HEADROOM_OFFLINE: '1'
      HEADROOM_BEACON: 'off'
      HEADROOM_TIKTOKEN_LOAD_TIMEOUT_SECONDS: '0.1'
      RUSTUP_TOOLCHAIN: '1.95.0'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: '1.95.0'
      - name: Build the repository's Rust extension
        run: |
          python -m pip install --upgrade pip maturin
          maturin build --profile ci --out dist --interpreter python3.12
          python -m pip install --no-deps dist/*.whl
          python -m pip install pytest pytest-asyncio pydantic tiktoken opentelemetry-api rich click pyyaml tomlkit truststore 'httpx[http2]' fastapi uvicorn openai
          SITE="$(python -c 'import sysconfig; print(sysconfig.get_path("platlib"))')"
          cp "${SITE}/headroom/"_core*.so headroom/
      - name: Compare real compression before and after
        run: |
          git worktree add --detach /tmp/headroom-base 5c8772b7210caeb291a202a58d4b5e88d51ff35b
          cp headroom/_core*.so /tmp/headroom-base/headroom/
          echo 'Before:'
          (cd /tmp/headroom-base && PYTHONPATH=. python "$GITHUB_WORKSPACE/scripts/contributor-proof.py")
          echo 'After:'
          PYTHONPATH=. python scripts/contributor-proof.py
      - name: Run focused regressions
        run: pytest tests/test_utils.py tests/test_relevance_split.py tests/test_memory_query_policy.py tests/test_proxy_ccr.py tests/test_compress_api.py -q
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install ruff==0.17.2 mypy==1.20.2
      - run: ruff check . && ruff format --check .
      - run: mypy headroom --ignore-missing-imports
